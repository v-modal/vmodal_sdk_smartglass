name: Smartglass simulator tests

# Exported unchanged with the SDK's .github/workflows directory.
# All repository paths are relative to the sdk_smartglass root.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smartglass-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator_test:
    if: ${{ github.repository == 'v-modal/vmodal_sdk_smartglass' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, lint, and test the complete Mock Device Kit lifecycle
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash examples/00_simulator/simulator.sh simulator_integration_test

      - name: Upload simulator reports and APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartglass-simulator-${{ github.run_id }}
          path: |
            examples/00_simulator/app/build/reports/
            examples/00_simulator/app/build/outputs/androidTest-results/
            examples/00_simulator/app/build/outputs/apk/
          if-no-files-found: warn
